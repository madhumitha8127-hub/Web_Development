<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>CSS Transitions and Transforms</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            text-align: center;
            padding: 40px;
        }

        h1 {
            color: #333;
        }

        /* CARD */

        .card {
            width: 250px;
            background-color: white;
            padding: 25px;
            margin: 40px auto;

            border-radius: 10px;

            box-shadow: 0 4px 10px #ccc;

            transition: 0.5s;
        }

        /* SCALE */

        .card:hover {
            transform: scale(1.1);
        }


        /* BUTTON */

        button {
            padding: 12px 25px;

            border: none;

            background-color: orange;

            color: white;

            font-size: 16px;

            cursor: pointer;

            border-radius: 5px;

            transition: 0.5s;
        }

        button:hover {
            background-color: black;

            transform: translateY(-5px);
        }


        /* ROTATE */

        .box {
            width: 100px;
            height: 100px;

            background-color: lightblue;

            margin: 50px auto;

            transition: 0.5s;
        }

        .box:hover {
            transform: rotate(45deg);
        }


        /* TRANSLATE */

        .circle {
            width: 100px;
            height: 100px;

            background-color: lightgreen;

            border-radius: 50%;

            margin: 50px auto;

            transition: 0.5s;
        }

        .circle:hover {
            transform: translateX(100px);
        }

    </style>

</head>

<body>

    <h1>CSS Transitions & Transforms</h1>


    <!-- SCALE -->

    <div class="card">

        <h2>Student Card</h2>

        <p>Hover over this card.</p>

    </div>


    <!-- BUTTON -->

    <button>
        Hover Me
    </button>


    <!-- ROTATE -->

    <div class="box"></div>


    <!-- TRANSLATE -->

    <div class="circle"></div>

</body>

</html>
