<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile</title>

    <!-- Connect CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="profile-card">

        <!-- Photo -->
        <img src="profile.jpg" alt="Student Photo" class="profile-img">

        <!-- Name -->
        <h1>Madhu</h1>

        <!-- Course -->
        <h3>Computer Science Engineering</h3>

        <!-- Year -->
        <p class="year">3rd Year Student</p>

        <!-- About Me -->
        <p class="about">
            I am a CSE student passionate about web development.
            I enjoy learning new technologies and building creative
            and useful websites.
        </p>

        <!-- Button -->
        <button>View Profile</button>

    </div>

</body>
</html>
