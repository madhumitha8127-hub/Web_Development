<!DOCTYPE html>
<html>
<head>
    <title>CSS Positioning</title>

    <style>
        .box {
            width: 100px;
            height: 100px;
            background: lightblue;
            margin: 20px;
            padding: 20px;
        }

        .relative {
            position: relative;
            left: 50px;
        }

        .container {
            width: 300px;
            height: 200px;
            background: lightgray;
            position: relative;
            margin: 20px;
        }

        .absolute {
            position: absolute;
            right: 10px;
            bottom: 10px;
            background: orange;
        }

        .static{
            position: static;
            bottom: 20px;
            right: 20px;
            background: green;
            color: white;
        }
    </style>
</head>

<body>

    <h1>CSS Positioning</h1>

    <div class="box">Normal</div>

    <div class="box relative">
        Relative
    </div>

    <div class="container">
        Container

        <div class="box absolute">
            Absolute
        </div>
    </div>

    <div class="box fixed">
        Fixed
    </div>

</body>
</html>
