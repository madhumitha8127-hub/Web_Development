<!DOCTYPE html>
<html>
<head>
    <title>DOM Basics</title>
</head>
<body>

    <h1 id="title">Hello Student</h1>

    <button onclick="changeText()">Change Text</button>

    <script>
        function changeText() {
            document.getElementById("title").textContent = "Welcome to JavaScript DOM!";
        }
    </script>

</body>
</html>
